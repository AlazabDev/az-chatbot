name: Chatbot Browser E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: bun install --frozen-lockfile
      - name: Install isolated Playwright test runner
        run: bun add --no-save @playwright/test@1.56.1
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Compile application for preview
        run: bun run build
      - name: Browser security and guest smoke
        run: bunx playwright test
