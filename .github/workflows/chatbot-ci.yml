name: Chatbot Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: ESLint
        run: bun run lint
      - name: Vitest
        run: bun run test
      - name: Build
        run: bun run build
