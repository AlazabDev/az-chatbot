name: Chatbot Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: bun install --frozen-lockfile
      - name: Build and regenerate TanStack route tree
        run: bun run build
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: ESLint (changed application paths)
        run: |
          bunx eslint src/lib/public-chat.server.ts src/lib/foundry-live.functions.ts src/lib/chatApi.ts src/lib/chatAnalytics.functions.ts src/routes/admin.analytics.tsx 'src/routes/api/public/agents.$slug.ts' src/routes/api/health.ts src/test/guest-chat.test.ts --rule 'prettier/prettier: off'
      - name: Legacy repository lint audit (non-blocking)
        continue-on-error: true
        run: bun run lint
      - name: Vitest
        run: bun run test
