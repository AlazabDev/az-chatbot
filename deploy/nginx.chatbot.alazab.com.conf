# bot.alazab.com / PM2 upstream at 127.0.0.1:3200
# Install only after checking existing Nginx server_name ownership.
# This is an HTTP bootstrap site. Run Certbot to add TLS/redirect after DNS resolves.
server {
  listen 80;
  listen [::]:80;
  server_name chatbot.alazab.com;
  client_max_body_size 4m;
  location / {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
